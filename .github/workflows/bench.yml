name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "benches/**"]

jobs:
  bench:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine,fnm
      # Shared runners are noisy, so the limit is far above what a real machine measures.
      - run: benches/bench.sh --check 50
        shell: bash
