name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  real-install:
    name: Real install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Install and switch Node versions from nodejs.org
        shell: bash
        run: |
          export SNE_DIR="$RUNNER_TEMP/sne"
          export PATH="$PWD/target/release:$PATH"
          sne install lts 20
          eval "$(sne env --shell bash --use-on-cd)"
          node -v && npm -v
          sne use 20
          node -v | grep '^v20\.'
          mkdir -p "$RUNNER_TEMP/project" && echo 'lts/*' > "$RUNNER_TEMP/project/.nvmrc"
          cd "$RUNNER_TEMP/project" && sne use --auto
          node -v | grep -v '^v20\.'
          sne doctor
