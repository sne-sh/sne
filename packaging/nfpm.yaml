# Template for the Linux packages (deb, rpm, apk, Arch), built with nfpm in the release workflow.
# ${VERSION}, ${ARCH} and ${BINARY} are filled in with envsubst.
name: sne
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: sne contributors <sne-sh@users.noreply.github.com>
description: |
  Simple Node Environment: a fast Node.js version manager.
  Installs Node.js versions from nodejs.org and switches between them per shell.
vendor: sne contributors
homepage: https://github.com/sne-sh/sne
license: MIT
contents:
  - src: ${BINARY}
    dst: /usr/bin/sne
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/sne/LICENSE
  - src: README.md
    dst: /usr/share/doc/sne/README.md
