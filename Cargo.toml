[package]
name = "sne"
version = "0.1.0-beta.4"
edition = "2024"
description = "Simple Node Environment: a fast, cross-platform Node.js version manager"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sne-sh/sne"
homepage = "https://sne-sh.github.io/sne/"
# Only what is needed to build and test the program goes to crates.io.
include = ["src/**", "tests/**", "build.rs", "assets/logo-256.png", "assets/sne.ico", "README.md", "LICENSE", "CHANGELOG.md"]
keywords = ["node", "nodejs", "version-manager", "nvm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
indicatif = "0.18.6"
node-semver = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.1"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# Only used by build.rs, to put the version and icon inside sne.exe.
[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target."cfg(not(windows))".dependencies]
liblzma = { version = "0.4.9", features = ["static"] }
tar = "0.4.46"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
