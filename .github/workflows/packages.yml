name: Packages

# Installs sne with each package manager manifest in this repository and runs it.
# The manifests are written by packaging/update-manifests.ps1 after a release is published.
on:
  push:
    branches: [main, develop]
    paths:
      - bucket/**
      - Formula/**
      - packaging/aur/**
      - packaging/winget/**
      - npm/**
      - .github/workflows/packages.yml
  pull_request:
    paths:
      - bucket/**
      - Formula/**
      - packaging/aur/**
      - packaging/winget/**
      - npm/**
      - .github/workflows/packages.yml
  workflow_dispatch:

# The workflow token can only read the repository unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoop:
    name: Scoop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\scoop\shims"
      - name: Install sne from the manifest
        shell: pwsh
        run: |
          $version = (Get-Content bucket\sne.json -Raw | ConvertFrom-Json).version
          scoop install "$PWD\bucket\sne.json"
          $said = sne --version
          if ($said -ne "sne $version") {
            Write-Host "::error title=Scoop::expected 'sne $version', got '$said'"
            exit 1
          }

  winget:
    name: winget manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate
        shell: pwsh
        run: |
          $dir = Get-ChildItem packaging\winget\manifests\s\sne-sh\sne -Directory | Select-Object -First 1
          winget validate --manifest $dir.FullName
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=winget::the manifest in $($dir.Name) is not valid"
            exit 1
          }

  homebrew:
    name: Homebrew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@45a4e9b516547553decd9bc1056249c8f6a565a2 # main
      - name: Install sne from the formula
        run: |
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/sne.rb)"
          # The tap is this checkout, so the formula under test is the one in this commit.
          git switch -c under-test
          brew tap sne-sh/sne "$PWD"
          brew install sne-sh/sne/sne
          said="$(sne --version)"
          if [ "$said" != "sne $version" ]; then
            echo "::error title=Homebrew::expected 'sne $version', got '$said'"
            exit 1
          fi
          brew test sne-sh/sne/sne

  npm:
    name: npm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Build the packages, install them and run sne
        shell: bash
        run: |
          # The version of the last release the manifests were written for.
          version="$(node -p "require('./bucket/sne.json').version")"
          system="$(node -p "process.platform + '-' + process.arch")"
          node npm/build.mjs "$version"
          # The packages are published from Windows, which has no executable bit. Remove it here
          # too, so this run shows that an installed sne still starts.
          if [ "$RUNNER_OS" != Windows ]; then chmod 644 "npm/dist/sne-$system/sne"; fi
          mkdir "$RUNNER_TEMP/tgz"
          for name in sne "sne-$system"; do
            (cd "npm/dist/$name" && npm pack --silent --pack-destination "$RUNNER_TEMP/tgz")
          done
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/tgz/*.tgz
          if [ "$RUNNER_OS" = Windows ]; then
            sne="$RUNNER_TEMP/prefix/sne"
          else
            sne="$RUNNER_TEMP/prefix/bin/sne"
            program="$RUNNER_TEMP/prefix/lib/node_modules/sne-$system/sne"
            if [ -x "$program" ]; then
              echo "::notice title=npm::npm made the program executable when it installed it"
            else
              echo "::notice title=npm::the program was not executable after install; the launcher fixes that"
            fi
          fi
          said="$("$sne" --version)"
          if [ "$said" != "sne $version" ]; then
            echo "::error title=npm::expected 'sne $version', got '$said'"
            exit 1
          fi

  aur:
    name: AUR
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Build and install the package
        run: |
          useradd -m build
          cp -r packaging/aur /home/build/aur
          chown -R build /home/build/aur
          cd /home/build/aur
          sudo -u build makepkg --noconfirm
          # .SRCINFO is written by hand in update-manifests.ps1, so compare it with the real one.
          sudo -u build makepkg --printsrcinfo > /tmp/SRCINFO
          if ! diff -u .SRCINFO /tmp/SRCINFO > /tmp/srcinfo.diff; then
            cat /tmp/srcinfo.diff
            echo "::error title=AUR::.SRCINFO differs from makepkg --printsrcinfo:%0A$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/srcinfo.diff)"
            exit 1
          fi
          pacman -U --noconfirm sne-bin-*.pkg.tar.zst
          sne --version
          test -f /etc/profile.d/sne.sh
