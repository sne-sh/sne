name: Release

# Pushing a tag such as 0.1.0 or 0.2.0-beta.1 runs every check, then builds every installer and attaches them to a
# draft release. A manual run, or a push to the release-dry-run branch, does the same without creating
# a release: the files are kept as the "release-files" artifact of the run.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
    branches: [release-dry-run]
  workflow_dispatch:

# The workflow token can only read the repository. The job that creates the release asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "$cargo_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version)"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, arch: x64 }
          - { target: i686-pc-windows-msvc, os: windows-latest, arch: x86 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Version
        shell: bash
        run: echo "TAG=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "sne-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item README.md, LICENSE, "target\${{ matrix.target }}\release\sne.exe" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $version = $env:TAG
          & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSourceExe=..\target\${{ matrix.target }}\release\sne.exe" installer\sne.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\installer\*-setup.exe .
      - name: Try the setup wizard
        shell: pwsh
        run: |
          $setup = Get-ChildItem sne-*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'sne-wizard-test'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/TASKS=', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          & "$dir\sne.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'The installed sne.exe does not run' }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            sne-*.zip
            sne-*-setup.exe

  macos:
    name: macOS
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Version
        run: echo "TAG=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Build and package both processors
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release --target "$target"
            name="sne-$TAG-$target"
            mkdir "$name"
            cp README.md LICENSE "target/$target/release/sne" "$name/"
            tar -czf "$name.tar.gz" "$name"
          done
      - name: Universal installer package
        run: |
          mkdir -p pkgroot/usr/local/bin
          lipo -create -output pkgroot/usr/local/bin/sne \
            target/x86_64-apple-darwin/release/sne target/aarch64-apple-darwin/release/sne
          chmod 755 pkgroot/usr/local/bin/sne
          pkgbuild --root pkgroot --identifier io.github.sne-sh.sne --version "$TAG" \
            --install-location / "sne-$TAG-macos-universal.pkg"
      - name: Try the package
        run: |
          sudo installer -pkg sne-*-macos-universal.pkg -target /
          /usr/local/bin/sne --version
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: |
            sne-*.tar.gz
            sne-*.pkg

  linux:
    name: ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Version
        run: echo "TAG=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name="sne-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "target/${{ matrix.target }}/release/sne" "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: sne-*.tar.gz

  publish:
    name: Packages and release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # sign the build provenance
      attestations: write    # store the build provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Version
        run: echo "TAG=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Linux packages (deb, rpm, apk, Arch)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="$TAG"
          for pair in x86_64:amd64 aarch64:arm64; do
            cpu="${pair%%:*}"
            export ARCH="${pair##*:}"
            # The musl build is fully static, so one binary works on every distribution.
            export BINARY="work-$ARCH/sne-$TAG-$cpu-unknown-linux-musl/sne"
            mkdir "work-$ARCH"
            tar -xzf "dist/sne-$TAG-$cpu-unknown-linux-musl.tar.gz" -C "work-$ARCH"
            envsubst '$VERSION $ARCH $BINARY' < packaging/nfpm.yaml > "work-$ARCH/nfpm.yaml"
            for packager in deb rpm apk archlinux; do
              nfpm package --config "work-$ARCH/nfpm.yaml" --packager "$packager" --target dist/
            done
          done
      - name: Try the deb package and install.sh
        run: |
          sudo dpkg -i dist/sne_*_amd64.deb
          /usr/bin/sne --version
          sudo dpkg -r sne
          (cd dist && sha256sum sne* > SHA256SUMS.txt)
          mkdir served && ln -s "$PWD/dist" "served/$TAG"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory served &
          sleep 2
          SNE_VERSION="$TAG" SNE_DOWNLOAD_BASE=http://127.0.0.1:8766 SNE_INSTALL_DIR="$RUNNER_TEMP/bin" \
            SNE_NO_PROFILE=1 sh install.sh
          "$RUNNER_TEMP/bin/sne" --version
      - name: Checksums
        run: cd dist && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/*
      # Records that these exact files were built by this workflow from this commit.
      # Anyone can check a download with: gh attestation verify <file> --repo sne-sh/sne
      - name: Build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md, plus how to install.
          awk -v heading="## $GITHUB_REF_NAME" '/^## / { on = (index($0, heading) == 1); next } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
          cat packaging/release-notes-footer.md >> notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The tag was built before: replace the files and notes of the existing release.
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "sne $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "sne $GITHUB_REF_NAME" --notes-file notes.md
          fi
