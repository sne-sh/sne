name: Website

# Publishes the site/ folder to GitHub Pages, with the logo and the changelog copied in.
# Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "assets/logo-512.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: cp CHANGELOG.md assets/logo-512.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
