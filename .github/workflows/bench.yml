name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "benches/**"]

# The workflow token can only read the repository unless a job asks for more.
permissions:
  contents: read

jobs:
  bench:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: hyperfine,fnm
      # Shared runners are noisy, so the limit is far above what a real machine measures.
      - run: benches/bench.sh --check 50
        shell: bash
