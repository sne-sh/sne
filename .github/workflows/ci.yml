name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # The Publish workflow starts it on the branch with new package manager files.
  workflow_dispatch:

# The workflow token can only read the repository unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  scripts:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  real-install:
    name: Real install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release
      - name: Install and switch Node versions from nodejs.org
        shell: bash
        run: |
          export SNE_DIR="$RUNNER_TEMP/sne"
          export PATH="$PWD/target/release:$PATH"
          sne install lts 20
          eval "$(sne env --shell bash --use-on-cd)"
          node -v && npm -v
          sne use 20
          node -v | grep '^v20\.'
          mkdir -p "$RUNNER_TEMP/project" && echo 'lts/*' > "$RUNNER_TEMP/project/.nvmrc"
          cd "$RUNNER_TEMP/project" && sne use --auto
          node -v | grep -v '^v20\.'
          sne doctor
